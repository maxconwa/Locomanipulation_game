# MAPPO (skrl 2.1): one PPO learner per agent, each with its own reward; both critics see the env state (the
# actors' observations once each as true, noise-free quantities, plus privileged information).
# https://skrl.readthedocs.io/en/latest/api/multi_agents/mappo.html

seed: 42

# Instantiated per agent with that agent's spaces. The actors are an LSTM (as ALMI-Open's, rnn below) then a
# [256, 128, 64] MLP on the LSTM's output concatenated with the raw observations, the critics a [128, 64, 32] MLP;
# built by recurrent.MarlRunner.
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False      # the env clips at cfg.clip_actions
    clip_log_std: True
    min_log_std: -3.0
    max_log_std: 0.0
    initial_log_std: 0.0
    rnn:                     # ALMI-Open's RNNActorMLPCritic: one LSTM layer of 64; trained on whole rollouts
      hidden_size: 64
      num_layers: 1
      skip_observations: True  # the MLP also sees the raw observations, not only the LSTM's 64 outputs
      # the cell state squashed after every step, c <- s tanh(c / s) (recurrent.py): no slow latch can build up (an
      # uncapped policy's cell grew over minutes on the robot and drifted its stance)
      cell_cap: 1.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [128, 64, 32]
        activations: elu
    output: ONE

# Read by scripts/skrl/train.py. Per-agent log std bounds, applied to the parameter after every update (skrl only
# clamps it in the forward pass, and a parameter past the bound then gets no gradient).
log_std_bounds:
  legs: [-3.0, -0.51]   # std 0.05 .. 0.6
  arms: [-3.0, 0.0]     # std 0.05 .. 1.0
# Per agent, [log_std_end, timestep]: the upper bound falls linearly to log_std_end by timestep (null: fixed).
log_std_anneal:
  legs: null
  arms: null
# Critics trained on raw returns: skrl fits the value scaler to the critic's own predictions too, and it ran away
# (the arms' in runs A-B, the legs' in fresh runs to a mean of 1e5-1e14).
no_value_preprocessor: [arms, legs]

memory:
  class: RandomMemory
  memory_size: -1  # = agent.rollouts

agent:
  class: MAPPO
  rollouts: 48              # 0.48 s at 100 Hz
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.995    # 0.99 and 0.95 at 50 Hz: the same horizon in seconds
  gae_lambda: 0.975
  learning_rate: 1.0e-03
  learning_rate_scheduler: KLAdaptiveLR
  # The legs adapt to half the arms' KL and may go lower: one large legs update once spiked their value loss and
  # raised falls from 1% to 6-10%.
  learning_rate_scheduler_kwargs:
    legs:
      kl_threshold: 0.01
      min_lr: 1.0e-04
      max_lr: 1.0e-03
    arms:
      kl_threshold: 0.02
      min_lr: 2.0e-04
      max_lr: 1.0e-02
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale:
    legs: 0.01
    arms: 0.0
  value_loss_scale: 1.0
  # early stop: the legs' update ends, mid-epoch, once its KL passes this
  kl_threshold:
    legs: 0.03
    arms: 0.0
  # Not the arms: bootstrapping time-outs through their value scaler fed back into it.
  time_limit_bootstrap:
    legs: True
    arms: False
  rewards_shaper_scale: 1.0
  experiment:
    directory: "locomanip_marl"
    experiment_name: ""
    write_interval: 48        # timesteps: one TensorBoard point per update
    checkpoint_interval: 9600 # timesteps: every 200 updates
    store_separately: False

trainer:
  class: SequentialTrainer
  timesteps: 600000          # 12500 updates x 48 rollouts (6000 s per env at 100 Hz); train.py --max_iterations sets it
  environment_info: log
