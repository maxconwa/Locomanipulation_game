# MAPPO (skrl 2.1): one PPO learner per agent, each with its own reward; both critics see the env state (both
# actors' observations plus privileged information).
# https://skrl.readthedocs.io/en/latest/api/multi_agents/mappo.html

seed: 42

# Instantiated per agent with that agent's spaces. The actors are an LSTM (as ALMI-Open's, rnn below) then a
# [256, 128, 64] MLP on the LSTM's output concatenated with the raw observations, the critics a [128, 64, 32] MLP;
# built by recurrent.MarlRunner. Every run up to almitrain_noknee_200k had MLP actors: [256, 128, 64] actors and
# critics up to feetodom_knee_200k, 64-32 actors in almisize_200k, 128-64-32 after; almitrain_lstm_200k's actors were
# the LSTM then a [128, 64, 32] MLP on its output alone. play.py, deploy_parity.py and eval_final.py build from this
# file, so for almitrain_lstm_200k's checkpoints pass 'agent.models.policy.rnn.skip_observations=False'
# 'agent.models.policy.network.0.layers=[128,64,32]'; for the MLP runs' '~agent.models.policy.rnn' and their layers,
# before almitrain 'agent.models.policy.network.0.layers=[256,128,64]' 'agent.models.value.network.0.layers=[256,128,64]'.
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False      # the env clips at cfg.clip_actions
    clip_log_std: True
    min_log_std: -3.0
    max_log_std: 0.0
    initial_log_std: 0.0
    rnn:                     # ALMI-Open's RNNActorMLPCritic: one LSTM layer of 64; trained on whole rollouts
      hidden_size: 64
      num_layers: 1
      skip_observations: True  # the MLP also sees the raw observations, not only the LSTM's 64 outputs
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [128, 64, 32]
        activations: elu
    output: ONE

# Read by scripts/skrl/train.py. Per-agent log std bounds, applied to the parameter after every update (skrl only
# clamps it in the forward pass, and a parameter past the bound then gets no gradient).
log_std_bounds:
  legs: [-3.0, -0.51]   # std 0.05 .. 0.6
  arms: [-3.0, 0.0]     # std 0.05 .. 1.0
# Critics trained on raw returns: skrl fits the value scaler to the critic's own predictions too, and it ran away
# (the arms' in runs A-B, the legs' in fresh runs to a mean of 1e5-1e14).
no_value_preprocessor: [arms, legs]

memory:
  class: RandomMemory
  memory_size: -1  # = agent.rollouts

agent:
  class: MAPPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.0e-03
  learning_rate_scheduler: KLAdaptiveLR
  # The legs adapt to half the arms' KL and may go lower: golemlim_zrange_200k's legs took one update at ~187k steps
  # that spiked their value loss and raised falls from 1% to 6-10%.
  learning_rate_scheduler_kwargs:
    legs:
      kl_threshold: 0.01
      min_lr: 1.0e-04
      max_lr: 1.0e-03
    arms:
      kl_threshold: 0.02
      min_lr: 2.0e-04
      max_lr: 1.0e-02
  # frozen at the env's fixed scales (cfg.observation_scales, train.py fix_observation_scales), not running statistics
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale:
    legs: 0.01
    arms: 0.0
  value_loss_scale: 1.0
  # early stop: the legs' update ends, mid-epoch, once its KL passes this
  kl_threshold:
    legs: 0.03
    arms: 0.0
  # Not the arms: bootstrapping time-outs through their value scaler fed back into it.
  time_limit_bootstrap:
    legs: True
    arms: False
  rewards_shaper_scale: 1.0
  experiment:
    directory: "locomanip_marl"
    experiment_name: ""
    write_interval: 24        # timesteps: one TensorBoard point per update
    checkpoint_interval: 4800 # timesteps: every 200 updates
    store_separately: False

trainer:
  class: SequentialTrainer
  timesteps: 200016          # 8334 updates x 24 rollouts (200k steps)
  environment_info: log
