# IPPO for LocoManip-Marl-Direct-v0: one independent PPO learner per agent
# (legs, arms), each with its own reward. Hyperparameters follow the IBR
# rounds' rsl_rl runner (agents/rsl_rl_ppo_cfg.py in the manager-based task)
# wherever skrl has the same knob.

seed: 42


# Instantiated per agent with that agent's spaces.
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False      # the env clips at cfg.clip_actions, like rsl_rl's clip_actions
    clip_log_std: True       # scripts/skrl/train.py also clamps the parameter after each update
    min_log_std: -3.0        # std 0.05: ClampedGaussianDistribution's min_std
    max_log_std: 0.0         # std 1.0:  its max_std
    initial_log_std: 0.0     # std 1.0:  its init_std
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 128, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        # asymmetric critic, as in IBR: the actor's obs + the privileged env state
        input: concatenate([OBSERVATIONS, STATES])
        layers: [256, 128, 64]
        activations: elu
    output: ONE


# Per-agent [min, max] log std, applied by scripts/skrl/train.py after every
# update (the model block above has one pair for both). Legs std <= 0.6:
# run 10 started at 0.58 and climbed to 0.70 within 1.6k updates once its
# damping terms were relaxed, with falls going 13% -> 28%; it settled back
# near 0.6 by the end.
log_std_bounds:
  legs: [-3.0, -0.51]   # std 0.05 .. 0.6
  arms: [-3.0, 0.0]     # std 0.05 .. 1.0

# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # = agent.rollouts


# Field names are skrl 2.1's IPPO_CFG.
# https://skrl.readthedocs.io/en/latest/api/multi_agents/ippo.html
agent:
  class: IPPO
  rollouts: 24               # num_steps_per_env
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.0e-03
  learning_rate_scheduler: KLAdaptiveLR
  # rsl_rl's desired_kl was 0.01 / min 1e-5. Under skrl IPPO that drove both
  # agents' learning rates down to ~1e-4 (arms) / 3e-4 (legs) and run 5's
  # metrics went flat for 3000 updates. KLAdaptiveLR divides when KL >
  # 2 x kl_threshold, so 0.02 tolerates KL up to 0.04; the floor keeps learning going.
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.02
    min_lr: 2.0e-04
    max_lr: 1.0e-02
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  # Per agent. The arms' 0.01 kept their std at ~0.76 (0.38 rad per joint at
  # scale 0.5) for 2000+ updates (run 4): too noisy to hold both wrists within
  # 5 cm. At 0.002 with the higher learning rate their std crept back up from
  # 0.15 to 0.20 (run 6). 0 like the IBR adversary: the arms' dense tracking
  # reward keeps it from collapsing, and train.py bounds it to [0.05, 1.0].
  entropy_loss_scale:
    legs: 0.01
    arms: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  time_limit_bootstrap: True  # rsl_rl bootstraps time-outs too
  rewards_shaper_scale: 1.0
  experiment:
    directory: "locomanip_marl"
    experiment_name: ""
    write_interval: 24        # timesteps: one TensorBoard point per update
    checkpoint_interval: 4800 # timesteps: every 200 updates
    store_separately: False


# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 360000          # 15000 updates x 24 rollouts
  environment_info: log
