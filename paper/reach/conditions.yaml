# The controllers the paper compares. To add a run: set its `run` (relative to paper/reach, or absolute) and, if you
# want an earlier checkpoint than the newest, `checkpoint`; then `make -C paper/reach all`.
#
#   label        names the results folder and the \reach{<label>/<sim>}{...} numbers; keep it short
#   name         legend label in the figures and the page
#   run          the run directory (with checkpoints/, estimator/, params/); lambda is read from params/env.yaml
#   checkpoint   optional checkpoint file name inside checkpoints/ (default: the newest agent_<N>.pt)
#   hero         this condition's workspace is the orange one in the hero figure (default: the highest lambda)
#   prose        how the page's summary names it (default "the <name> policy")
#   dash         dotted or dashed: draw this run's lines dashed (e.g. an intermediate checkpoint of a listed run)
#   hero_figure  false keeps this run out of the hero figure (it stays in the gallery figures)
#   evaluate     false: make all uses this run's existing results and runs no new evaluation of it
#   color        a fixed line colour (default: lambda's place on the orange ramp)
#   status       shown on the page while the condition has no results
#
# Figures and tables show the conditions listed here (plus GOLEM's arm IK), in this order.
conditions:
  - label: l1
    name: "λ = 1"
    run: ""
    status: "training (coworker)"
    hero: true
  - label: l0.5
    name: "λ = 0.5"
    run: ../../logs/skrl/locomanip_marl/paper05
    checkpoint: agent_91200.pt
    prose: "the λ = 0.5 policy"
    status: "evaluating"
  - label: l0
    name: "λ = 0"
    run: ""
    status: "training (coworker)"
  - label: whole
    name: "Whole-body agent"
    run: ""
    color: "#7b3fa0"     # purple: >= 9 OKLab x100 from the orange ramp, the blind blue and GOLEM's grey under CVD
    prose: "the one-agent whole-body policy"
    status: "not trained (LocoManip-WholeBody-Direct-v0, b701ed0)"
  - label: l0.5_52k
    name: "λ = 0.5, 52.8k steps"
    run: ../../logs/skrl/locomanip_marl/2026-10-08_14-34-36_paper_yaw_91k
    checkpoint: agent_52800.pt
    prose: "the λ = 0.5 policy at 52.8k steps"
    dash: dotted
    hero_figure: false
    evaluate: false        # its Isaac (full) and MuJoCo results are in; make all does not add more
    status: "evaluated in part"
