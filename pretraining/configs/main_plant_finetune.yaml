# Stage-1 fine-tune on main's plant with main's domain randomization (LocoManip-Pretrain-Track-Main-FineTune-v0) and
# the estop position penalty: golem_aware.yaml with main_plant.yaml's rate changes and 40000 iterations of its own.
#   python -m pretraining.scripts.train --config pretraining/configs/main_plant_finetune.yaml --plant main --fine-tune \
#       --run-name <name> --fine-tune-from <main-plant stage-1 run dir>
num_envs: 2048  # base.yaml's 5120 do not fit a 16 GB GPU
runner:
  headless: true
  buffer_size: 1000
  representation: gencoord
  actor_obs: proprio
  log_interval: 10
  save_interval: 32000
  history_length: 1
  termination_softness: 0.05
  dynamics_hidden_dims: [2048, 2048, 2048]
  wm:
    lr: 0.0002
    num_batches: 10
    batch_size: 1024  # horizon 16 x 1024 keeps base.yaml's 8 x 2048 world-model samples; x2048 ran out of 16 GB
    horizon: 16  # 100 Hz: the same 0.16 s as base.yaml's 8 at 50 Hz
    nominal_error_root_pose_pos: 0.01
    nominal_error_root_pose_ori: 0.02
    nominal_error_joint_pos: 0.1
    nominal_error_joint_vel: 3.14
    nominal_error_body_pos: 0.05
    nominal_error_body_rot: 0.1
    nominal_error_body_vel: 1.0
    nominal_error_body_avel: 3.14
  max_iterations: 40000  # iterations of the fine-tune itself: it continues the source run's count
  replay_ratio: 16
  latent_dim: 32
  actor_hidden_dims: [2048, 1024, 512, 256]
  critic_hidden_dims: [256, 128]
  command_hidden_dims: [512, 256]
  policy:
    lr: 0.0002
    num_batches: 1
    batch_size: 384  # horizon 64: x1024 and x512 (10.9 GB peak in the policy update) ran out of 16 GB
    horizon: 64  # 0.64 s, base.yaml's 32 steps at 50 Hz
    gamma: 0.995  # the same 1 / (1 - gamma) = 2 s horizon as 0.99 at 50 Hz
    survival_masking: true
    beta2: 0.95
    grad_clip_value: 0.1
    lam: 0.975  # the same 0.4 s trace as 0.95 at 50 Hz
  sampling_mode: return
  return_sampler:
    gamma: 0.995
    horizon: 40
    memory: 256
    steepness: 25.0
    explore: 0.5
    keep: 0.1
  max_seconds: 0.0
  checkpoint_interval_s: 3600.0
  keep_checkpoints: 40
  resume_warmup: 50
rewards:
  legs_root_pos: {weight: 0.5, std: 0.3}
  legs_root_ori: {weight: 0.5, std: 0.4}
  legs_body_pos: {weight: 1.0, std: 0.3}
  legs_body_ori: {weight: 1.0, std: 0.4}
  legs_body_lin_vel: {weight: 1.0, std: 1.0}
  legs_body_ang_vel: {weight: 1.0, std: 3.14}
  arms_body_pos: {weight: 1.0, std: 0.15}
  arms_body_ori: {weight: 1.0, std: 0.4}
  arms_ee_pos: {weight: 1.0, std: 0.1}
  arms_ee_ori: {weight: 0.5, std: 0.4}
  estop:
    margin: 0.9
    velocity: -5.0
    torque: -5.0
    position: -20.0
    position_margin: 0.05
